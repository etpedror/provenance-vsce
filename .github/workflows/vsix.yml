name: VSIX

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run package -- --out provenance.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: provenance-vsix
          path: provenance.vsix
          if-no-files-found: error
